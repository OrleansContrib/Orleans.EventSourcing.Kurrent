name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish from
        required: true
        type: string

permissions:
  contents: read
  id-token: write # for NuGet trusted publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Push to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack from tag
        run: dotnet pack src/Orleans.EventSourcing.Kurrent/Orleans.EventSourcing.Kurrent.csproj --configuration Release --no-build --output packages
            
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ github.actor }}
    
      - name: Push to NuGet.org (trusted publishing)
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "packages/*.snupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
